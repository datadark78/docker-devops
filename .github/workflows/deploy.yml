name: Deploy to AWS

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v3
      
      # Step 2: Build Docker image
      - name: Build Docker image
        run: |
          docker build -t ernes78/efraile-nginx:latest .
          docker build -t ernes78/efraile-nginx:${{ github.sha }} .
      
      # Step 3: Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      # Step 4: Push to Docker Hub
      - name: Push to Docker Hub
        run: |
          docker push ernes78/efraile-nginx:latest
          docker push ernes78/efraile-nginx:${{ github.sha }}
      
      # Step 5: Deploy to AWS (via SSH)
      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ubuntu
          key: ${{ secrets.AWS_KEY }}
          script: |
            cd ~/docker-devops
            git pull origin main
            docker-compose down
            docker-compose pull
            docker-compose up -d
            echo "✅ Deployment successful!"
