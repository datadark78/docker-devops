
services:
  # Nginx web server
  web:
    image: nginx:latest
    ports:
      - "8001:80"
    volumes:
      - .:/usr/share/nginx/html/ 
    networks:
      - devops-network
    depends_on:
      - db
    restart: always

  # MySQL database
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: devops123
      MYSQL_DATABASE: devops_db
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - devops-network
    restart: always

  # Redis cache
  cache:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - devops-network
    restart: always

volumes:
  mysql-data:

networks:
  devops-network:
    driver: bridge
